#  INSTALL PHASE PERMISSIONS
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "auranet-bootstrap.fullname" . }}-sa
  namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "auranet-bootstrap.fullname" . }}-clusterrole
rules:
- apiGroups: ["cilium.io"]
  resources: ["ciliumnetworkpolicies", "tracingpoliciesnamespaced"]
  # Added 'delete' verb for cleanupOrphanedPolicies
  verbs: ["create", "get", "list", "patch", "update", "delete"] 
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "auranet-bootstrap.fullname" . }}-clusterrolebinding
subjects:
- kind: ServiceAccount
  name: {{ include "auranet-bootstrap.fullname" . }}-sa
  namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: {{ include "auranet-bootstrap.fullname" . }}-clusterrole
  apiGroup: rbac.authorization.k8s.io

#  TEARDOWN PHASE PERMISSIONS (NO HOOKS)
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "auranet-bootstrap.fullname" . }}-cleanup-sa
  namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "auranet-bootstrap.fullname" . }}-cleanup-clusterrole
rules:
- apiGroups: ["cilium.io"]
  resources: ["ciliumnetworkpolicies", "tracingpoliciesnamespaced"]
  verbs: ["list", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "auranet-bootstrap.fullname" . }}-cleanup-rb
subjects:
- kind: ServiceAccount
  name: {{ include "auranet-bootstrap.fullname" . }}-cleanup-sa
  namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: {{ include "auranet-bootstrap.fullname" . }}-cleanup-clusterrole
  apiGroup: rbac.authorization.k8s.io