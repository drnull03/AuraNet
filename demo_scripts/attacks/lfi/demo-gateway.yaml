apiVersion: v1
kind: ConfigMap
metadata:
  name: demo-gateway-conf
  namespace: default
data:
  default.conf: |
    server {
        listen 80;
        location / {
            proxy_pass http://vulnerable-app:3000;
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-gateway
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: demo-gateway
  template:
    metadata:
      labels:
        app: demo-gateway
    spec:
      containers:
      - name: proxy
        image: nginx:alpine
        volumeMounts:
        - name: conf
          mountPath: /etc/nginx/conf.d/
      volumes:
      - name: conf
        configMap:
          name: demo-gateway-conf
---
apiVersion: v1
kind: Service
metadata:
  name: demo-gateway
  namespace: default
spec:
  selector:
    app: demo-gateway
  ports:
  - port: 80
    targetPort: 80
