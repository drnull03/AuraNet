loader:
  image:
    repository: auranet/loader
    tag: "0.2.0"
    pullPolicy: IfNotPresent

imagePullSecrets: []

config:
  pid: 0
  filterSyscalls: ""
  logLevel: INFO

kernelHeaders:
  libModules:
    hostPath: /lib/modules
    mountPath: /lib/modules
  usrSrc:
    hostPath: /usr/src
    mountPath: /usr/src

btf:
  enabled: true
  hostPath: /sys/kernel/btf/vmlinux
  mountPath: /sys/kernel/btf/vmlinux

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

securityContext:
  privileged: true

hostPID: true
hostNetwork: false

nodeSelector: {}

tolerations:
  - key: node-role.kubernetes.io/control-plane
    operator: Exists
    effect: NoSchedule
  - key: node-role.kubernetes.io/master
    operator: Exists
    effect: NoSchedule

serviceAccount:
  create: true
  name: ""