apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: auranet-loader
  namespace: auranet-namespace
spec:
  selector:
    matchLabels:
      app: auranet-loader
  template:
    metadata:
      labels:
        app: auranet-loader
    spec:
      hostPID: true
      tolerations:
        - operator: Exists
      containers:
        - name: loader
          image: auranet-loader:latest
          securityContext:
            privileged: true
          volumeMounts:
            # Crucial: Bidirectional mount allows pinning to persist on the host
            - name: bpf-fs
              mountPath: /sys/fs/bpf
              mountPropagation: Bidirectional
      volumes:
        - name: bpf-fs
          hostPath:
            path: /sys/fs/bpf
            type: DirectoryOrCreate