apiVersion: v1
kind: ConfigMap
metadata:
  name: auranet-engine-config
  namespace: {{ .Release.Namespace }}
  labels:
    app: auranet-engine
data:
  ai-config.json: |
    {
      "inputDim": {{ .Values.engine.aiConfig.inputDim }},
      "tripwireThreshold": {{ .Values.engine.aiConfig.tripwireThreshold }},
      "localTrainIntervalSec": {{ .Values.engine.aiConfig.localTrainIntervalSec }},
      "maxBufferSize": {{ .Values.engine.aiConfig.maxBufferSize }},
      "localEpochs": {{ .Values.engine.aiConfig.localEpochs }},
      "learningRate": {{ .Values.engine.aiConfig.learningRate }},
      "trustedIdentities": {{ toJson .Values.engine.aiConfig.trustedIdentities }},
      "nlpTripwire": {{ .Values.engine.aiConfig.nlpTripwire }},
      "nlpBodyTripwire": {{ .Values.engine.aiConfig.nlpBodyTripwire }},
      "zScoreThreshold": {{ .Values.engine.aiConfig.zScoreThreshold }},
      "zScoreWindowSize": {{ .Values.engine.aiConfig.zScoreWindowSize }},
      "learningEngine": {{ .Values.engine.aiConfig.learningEngine }},
      "thirdBrain": {{ .Values.engine.aiConfig.thirdBrain }}
    }